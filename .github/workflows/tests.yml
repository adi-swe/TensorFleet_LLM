name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase1:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch on Linux runners
        if: runner.os == 'Linux'
        run: python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check lint and formatting
        run: |
          python -m ruff check src tests examples
          python -m ruff format --check src tests examples
      - name: Select loopback for single-host Gloo tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "GLOO_SOCKET_IFNAME=lo0" >> "$GITHUB_ENV"
          else
            echo "GLOO_SOCKET_IFNAME=lo" >> "$GITHUB_ENV"
          fi
      - name: Run unit and real-worker integration tests
        timeout-minutes: 8
        run: python -m pytest -vv -s -ra -o faulthandler_timeout=60 --junitxml=test-results.xml
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import tensorfleet.training.ddp_executor, tensorfleet.simulator.calibration, tensorfleet.controller.candidate_search, tensorfleet.experiments.runner"
          tensorfleet --help
          python -m tensorfleet --help
      - name: Check whitespace
        run: git diff --check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
